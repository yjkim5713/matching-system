<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAU Pharmacy Matching Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.025em; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
            <h1 class="text-2xl font-black text-slate-900 italic tracking-tighter">Matching Engine <span class="text-blue-600">FINAL v10.8</span></h1>
            <div id="statArea" class="mt-4 flex justify-center gap-10 font-black text-sm text-slate-500">
                <div>선배 신청: <span id="seniorStat" class="text-blue-600 text-xl">0팀</span></div>
                <div>후배 신청: <span id="juniorStat" class="text-emerald-600 text-xl">0팀</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 max-w-2xl mx-auto text-white">
                <div class="bg-blue-600 p-4 rounded-2xl text-center shadow-lg">
                    <p class="text-[11px] opacity-80 font-bold mb-1 uppercase tracking-widest">Matched Senior Groups</p>
                    <p id="matchSuccessCount" class="text-2xl font-black">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl text-center shadow-lg">
                    <p class="text-[11px] opacity-80 font-bold mb-1 uppercase tracking-widest">Junior-only Groups</p>
                    <p id="matchFailCount" class="text-2xl font-black">0</p>
                </div>
            </div>
        </header>

        <div class="lg:grid lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 mb-2 uppercase italic">Admin Console</p>
                    <textarea id="seniorData" rows="4" class="w-full p-3 border rounded-xl text-[10px] font-mono mb-2 focus:ring-2 focus:ring-blue-400 outline-none" placeholder="Senior JSON"></textarea>
                    <textarea id="juniorData" rows="4" class="w-full p-3 border rounded-xl text-[10px] font-mono mb-4 focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="Junior JSON"></textarea>
                    <button onclick="runUltimateV108()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg transition-all active:scale-95 mb-2">새 매칭 실행하기 🚀</button>
                    <button onclick="saveToFirebase()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-all shadow-md">결과 서버 저장 (전체 공유) ☁️</button>
                </div>
                <p class="text-[10px] text-slate-400 px-2 leading-relaxed font-medium">※ 매칭 실행 후 반드시 '서버 저장'을 눌러야 다른 사람들이 결과를 볼 수 있습니다.</p>
            </div>

            <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-[800px] flex flex-col mt-8 lg:mt-0">
                <div id="resultContainer" class="flex-1 overflow-y-auto space-y-4 pr-3 custom-scrollbar text-[11px]">
                    <div class="flex flex-col items-center justify-center h-full text-slate-300">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div>
                        <p class="font-bold italic italic">데이터를 불러오는 중입니다...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ★ Firebase 설정 (윤정 님의 설정값 그대로 사용하세요)
        const firebaseConfig = { 
            apiKey: "AIzaSyBqxhmeJBTrrYCil_0TZZ7N4lvBwLCHQgY",
  authDomain: "index-57ec0.firebaseapp.com",
  projectId: "index-57ec0",
  storageBucket: "index-57ec0.firebasestorage.app",
  messagingSenderId: "451060671210",
  appId: "1:451060671210:web:5dd9e2a430b3ac2a682d93" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentGroups = [];
        const dateOrder = ["3/16(월)", "3/17(화)", "3/18(수)", "3/19(목)", "3/20(금)", "3/21(토)", "3/22(일)", "3/23(월)", "3/24(화)", "3/25(수)", "3/26(목)", "3/27(금)"];

        // ★ 페이지 접속 시 자동 로드 기능
        window.onload = async () => {
            try {
                const doc = await db.collection("matching").doc("current_result").get();
                if (doc.exists) {
                    const savedData = JSON.parse(doc.data().data);
                    currentGroups = savedData;
                    renderV108(currentGroups);
                    updateStatsV108();
                } else {
                    document.getElementById('resultContainer').innerHTML = '<p class="text-center text-slate-300 mt-20 font-bold italic">저장된 결과가 없습니다. 매칭을 실행해주세요.</p>';
                }
            } catch (e) {
                console.error("데이터 로드 실패:", e);
                document.getElementById('resultContainer').innerHTML = '<p class="text-center text-red-300 mt-20 font-bold italic">데이터 로드 실패</p>';
            }
        };

        function runUltimateV108() {
            try {
                const sIn = JSON.parse(document.getElementById('seniorData').value || "[]");
                const jIn = JSON.parse(document.getElementById('juniorData').value || "[]");
                let sPool = [...sIn], jPool = [...jIn], finalGroups = [];

                // 1. 선배 정렬 (날짜 희귀순)
                sPool.sort((a, b) => (a.dates[0] === "모두 불가" ? 1 : b.dates[0] === "모두 불가" ? -1 : a.dates.length - b.dates.length));

                // 2. 선배 33팀 루프 - 후배 최소 1팀 매칭 보장
                sPool.forEach(senior => {
                    let combined = [];
                    for (let d of senior.dates) {
                        let curJ = jPool.filter(j => j.dates.includes(d));
                        if (curJ.length > 0) { combined = getSafeJuniorsV108(curJ, jPool); if (combined.length > 0) break; }
                    }
                    if (combined.length === 0 && jPool.length > 0) combined = getSafeJuniorsV108(jPool, jPool);

                    finalGroups.push({
                        date: senior.dates.includes("모두 불가") ? "날짜조율필요" : (senior.dates.find(d => combined[0]?.dates.includes(d)) || senior.dates[0]),
                        sTeam: senior, combinedJuniors: combined, mode: "매칭 성공"
                    });
                });

                // 3. 남은 후배들 학생회 조
                while (jPool.length > 0) {
                    let combined = getSafeJuniorsV108(jPool, jPool);
                    finalGroups.push({ date: combined[0]?.dates[0] || "날짜미정", sTeam: null, combinedJuniors: combined, mode: "학생회 투입" });
                }

                finalGroups.sort((a, b) => dateOrder.indexOf(a.date) - dateOrder.indexOf(b.date));
                currentGroups = finalGroups;
                renderV108(finalGroups);
                updateStatsV108();
                alert("매칭이 완료되었습니다! '결과 서버 저장' 버튼을 눌러 공유하세요.");
            } catch (e) { alert("JSON 형식을 확인해주세요!"); }
        }

        function getSafeJuniorsV108(list, master) {
            if (list.length === 0) return [];
            let combined = [];
            let solos = list.filter(j => j.type === '개별팀');
            if (solos.length === 4) {
                for (let i = 0; i < 2; i++) {
                    let s = solos.shift(); combined.push(s);
                    master.splice(master.indexOf(s), 1);
                }
                return combined;
            }
            for (let j of list) {
                let currentTotal = combined.reduce((acc, cur) => acc + (cur.type.includes('3인')?3:(cur.type.includes('2인')?2:1)), 0);
                let nextSize = j.type.includes('3인')?3:(j.type.includes('2인')?2:1);
                if (currentTotal === 0 || (currentTotal + nextSize <= 3)) {
                    combined.push(j); master.splice(master.indexOf(j), 1);
                    if (currentTotal + nextSize >= 2) break;
                }
            }
            return combined;
        }

        function renderV108(groups) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            groups.forEach((g, i) => {
                const isSuccess = !!g.sTeam;
                const div = document.createElement('div');
                div.className = `p-6 border-2 rounded-[2.5rem] mb-4 bg-white shadow-sm ${isSuccess ? 'border-blue-100' : 'border-orange-100 bg-orange-50/20'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4 border-b pb-3 border-slate-100">
                        <span class="font-black text-slate-800 text-sm">조 #${i+1} <span class="text-[10px] text-slate-400 font-normal ml-2">${g.date}</span></span>
                        <span class="text-[9px] font-bold px-2 py-1 rounded-full ${isSuccess?'bg-blue-600':'bg-orange-600'} text-white uppercase">${g.mode}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-[10px]">
                        <div>
                            <div class="flex justify-between items-center mb-1"><p class="text-[9px] font-black text-slate-400 uppercase italic">Senior</p>
                            <button onclick="addStaffV108(${i})" class="text-[9px] font-bold text-blue-600 underline">+ 기입</button></div>
                            <div class="bg-slate-50 p-4 rounded-3xl border border-white space-y-2 min-h-[110px] shadow-inner">
                                ${g.sTeam ? `<b class="text-slate-900 text-[13px] font-black">${g.sTeam.name}</b> (${g.sTeam.id})<br><span>${g.sTeam.phone}</span>${g.sTeam.plusName ? `<div class="mt-2 pt-2 border-t border-slate-200"><b>${g.sTeam.plusName}</b><br><span>${g.sTeam.plusPhone}</span></div>` : ''}` : '<p class="text-slate-400 italic font-bold">학생회 전용 조</p>'}
                                ${g.staff ? g.staff.map(s => `<div class="bg-slate-800 text-white p-2 rounded-xl flex justify-between items-center mt-1"><span><b>${s.name}</b><br>${s.phone}</span><button onclick="removeStaffV108(${i}, '${s.id}')">✕</button></div>`).join('') : ''}
                            </div>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase italic mb-1">Juniors</p>
                            <div class="bg-slate-50 p-4 rounded-3xl border border-white space-y-3 min-h-[110px] shadow-inner">
                                ${g.combinedJuniors.map(j => `<div class="pb-2 last:pb-0"><b class="text-slate-900 text-[14px] font-black underline decoration-blue-100">${j.name}</b> (${j.type})<br><span>${j.phone}</span>${j.plusName ? `<div class="mt-1 font-bold">• ${j.plusName} (${j.plusPhone})</div>` : ''}${j.plusName2 ? `<div class="mt-0.5 font-bold">• ${j.plusName2} (${j.plusPhone2})</div>` : ''}</div>`).join('<div class="border-t border-slate-100 my-2"></div>')}
                            </div>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        }

        function updateStatsV108() {
            document.getElementById('matchSuccessCount').innerText = currentGroups.filter(g => g.sTeam).length;
            document.getElementById('matchFailCount').innerText = currentGroups.filter(g => !g.sTeam).length;
        }

        async function saveToFirebase() {
            try {
                await db.collection("matching").doc("current_result").set({ 
                    data: JSON.stringify(currentGroups), 
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp() 
                });
                alert("서버 저장 완료! 이제 다른 사람들도 링크에서 결과를 볼 수 있습니다.");
            } catch (e) { alert("저장 실패"); }
        }

        function addStaffV108(idx) {
            const n = prompt("이름:"); const p = prompt("연락처:");
            if (n && p) {
                if (!currentGroups[idx].staff) currentGroups[idx].staff = [];
                currentGroups[idx].staff.push({ id: Date.now().toString(), name: n, phone: p });
                renderV108(currentGroups);
            }
        }
        function removeStaffV108(gi, si) {
            currentGroups[gi].staff = currentGroups[gi].staff.filter(s => s.id !== si);
            renderV108(currentGroups);
        }
    </script>
</body>
</html>
