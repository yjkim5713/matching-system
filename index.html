<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAU 학번 매칭 시스템 Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.025em; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .group-card { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-6 border-b pb-4 border-slate-100">
                <h1 class="text-2xl font-black text-slate-900 underline decoration-blue-500 underline-offset-8">학번 교류 최종 매칭 시스템</h1>
                <div class="flex gap-4 font-bold text-xs uppercase text-slate-400">
                    <div>Senior: <span id="seniorStat" class="text-blue-600">0</span></div>
                    <div>Junior: <span id="juniorStat" class="text-emerald-600">0</span></div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-blue-600 p-4 rounded-2xl text-center shadow-lg shadow-blue-100">
                    <p class="text-[11px] text-blue-100 font-bold mb-1">매칭 성공 (선배 배정 조)</p>
                    <p id="matchSuccessCount" class="text-3xl font-black text-white">0</p>
                </div>
                <div class="bg-orange-500 p-4 rounded-2xl text-center shadow-lg shadow-orange-100">
                    <p class="text-[11px] text-orange-100 font-bold mb-1">매칭 실패 (학생회 필요 조)</p>
                    <p id="matchFailCount" class="text-3xl font-black text-white">0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Senior JSON</label>
                    <textarea id="seniorData" rows="5" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-slate-50 outline-none focus:ring-2 focus:ring-blue-400" placeholder="선배 데이터를 넣어주세요."></textarea>
                </div>
                <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-200">
                    <label class="block text-[10px] font-black text-slate-400 mb-2 uppercase tracking-widest">Junior JSON</label>
                    <textarea id="juniorData" rows="5" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-slate-50 outline-none focus:ring-2 focus:ring-emerald-400" placeholder="후배 데이터를 넣어주세요."></textarea>
                </div>
                <button onclick="runFinalMatching()" class="w-full bg-slate-900 hover:bg-black text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 text-lg">
                    매칭 실행 ⚡
                </button>
                <button onclick="saveToFirebase()" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-2xl transition-all border border-blue-200">
                    결과 서버(링크)에 저장하기 ☁️
                </button>
            </div>

            <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-[800px] flex flex-col">
                <div id="resultContainer" class="flex-1 overflow-y-auto space-y-4 pr-3 custom-scrollbar text-[11px]">
                    <p class="text-center text-slate-300 mt-20 italic">데이터를 불러오는 중이거나 입력 대기 중입니다.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // [필독] Firebase 콘솔의 설정값을 여기에 붙여넣으세요!
        const firebaseConfig = {
            apiKey: "AIzaSyBqxhmeJBTrrYCil_0TZZ7N4lvBwLCHQgY",
  authDomain: "index-57ec0.firebaseapp.com",
  projectId: "index-57ec0",
  storageBucket: "index-57ec0.firebasestorage.app",
  messagingSenderId: "451060671210",
  appId: "1:451060671210:web:5dd9e2a430b3ac2a682d93"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentGroups = []; // 현재 매칭된 조 데이터 전역 변수

        // 페이지 로드 시 서버에서 데이터 가져오기
        window.onload = async () => {
            try {
                const doc = await db.collection("matching").doc("current_result").get();
                if (doc.exists) {
                    currentGroups = JSON.parse(doc.data().data);
                    render(currentGroups);
                    updateStats(currentGroups);
                    document.getElementById('resultContainer').insertAdjacentHTML('afterbegin', 
                        '<p class="text-center text-blue-500 font-bold mb-4 bg-blue-50 py-2 rounded-xl border border-blue-100 italic">✅ 서버에서 최신 배정 결과를 불러왔습니다.</p>');
                }
            } catch (e) { console.log("불러올 데이터가 없습니다."); }
        };

        function runFinalMatching() {
            try {
                const seniors = JSON.parse(document.getElementById('seniorData').value || "[]");
                const juniors = JSON.parse(document.getElementById('juniorData').value || "[]");
                
                document.getElementById('seniorStat').innerText = seniors.length + "팀";
                document.getElementById('juniorStat').innerText = juniors.length + "팀";

                let sPool = [...seniors];
                let jPool = [...juniors];
                let groups = [];
                const dates = ["3/16(월)", "3/17(화)", "3/18(수)", "3/19(목)", "3/20(금)", "3/21(토)", "3/22(일)", "3/23(월)", "3/24(화)", "3/25(수)", "3/26(목)", "3/27(금)"];

                // 매칭 로직 (성별+날짜 -> 날짜 -> 무작위 -> 후배끼리)
                dates.forEach(date => {
                    ['남', '여'].forEach(gender => {
                        let curS = sPool.filter(s => s.dates.includes(date) && s.gender.trim() === gender);
                        let curJ = jPool.filter(j => j.dates.includes(date) && j.gender.trim() === gender);
                        while (curS.length > 0 && curJ.length > 0) {
                            let sTeam = curS.shift();
                            let combinedJuniors = fillGroup(curJ, jPool);
                            if (combinedJuniors.length > 0) {
                                groups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors, mode: '정상 매칭' });
                                sPool = sPool.filter(s => s !== sTeam);
                            } else break;
                            curJ = jPool.filter(j => j.dates.includes(date) && j.gender.trim() === gender);
                        }
                    });
                });

                dates.forEach(date => {
                    let curS = sPool.filter(s => s.dates.includes(date));
                    let curJ = jPool.filter(j => j.dates.includes(date));
                    while (curS.length > 0 && curJ.length > 0) {
                        let sTeam = curS.shift();
                        let combinedJuniors = fillGroup(curJ, jPool);
                        if (combinedJuniors.length > 0) {
                            groups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors, mode: '성별무관' });
                            sPool = sPool.filter(s => s !== sTeam);
                        } else break;
                        curJ = jPool.filter(j => j.dates.includes(date));
                    }
                });

                sPool.forEach(sTeam => {
                    if (jPool.length > 0) {
                        let jTeam = jPool.shift();
                        groups.push({ type: 'SUCCESS', date: '무작위', sTeam, combinedJuniors: [jTeam], mode: '무작위' });
                    }
                });

                dates.forEach(date => {
                    let curJ = jPool.filter(j => j.dates.includes(date));
                    while (curJ.length > 0) {
                        let combinedJuniors = fillGroup(curJ, jPool);
                        groups.push({ type: 'FAIL', date, combinedJuniors, mode: '학생회 필요' });
                        curJ = jPool.filter(j => j.dates.includes(date));
                    }
                });

                currentGroups = groups;
                render(groups);
                updateStats(groups);
            } catch (e) { alert("JSON 형식을 확인해주세요!"); }
        }

        function fillGroup(list, master) {
            let combined = []; let total = 0;
            while (list.length > 0) {
                let target = list[0];
                let size = (target.type.includes('3인')) ? 3 : (target.type.includes('2인') ? 2 : 1);
                if (total + size <= 3) {
                    combined.push(list.shift());
                    total += size;
                    master.splice(master.indexOf(target), 1);
                } else break;
            }
            return combined;
        }

        function updateStats(groups) {
            document.getElementById('matchSuccessCount').innerText = groups.filter(g => g.type === 'SUCCESS').length;
            document.getElementById('matchFailCount').innerText = groups.filter(g => g.type === 'FAIL').length;
        }

        function render(groups) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            groups.forEach((g, i) => {
                const div = document.createElement('div');
                const isSuccess = g.type === 'SUCCESS';
                div.className = `group-card p-5 border-2 rounded-[2rem] shadow-sm mb-4 bg-white ${isSuccess ? 'border-blue-100' : 'border-orange-100 bg-orange-50/20'}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-100">
                        <span class="font-black text-slate-800 italic text-sm">조 #${i+1} <span class="text-[10px] text-slate-400 font-normal ml-2">📅 ${g.date}</span></span>
                        <span class="text-[9px] font-bold px-2 py-1 rounded-full ${isSuccess?'bg-blue-600 text-white':'bg-orange-500 text-white'} uppercase">${g.mode}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center"><p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter">Seniors / Staff</p>
                            <button onclick="addStaffToGroup(${i})" class="text-[9px] font-bold text-blue-600 underline">+ 기입</button></div>
                            <div id="staff-list-${i}" class="bg-slate-50 p-3 rounded-2xl border border-white space-y-2">
                                ${g.sTeam ? `<div><b>${g.sTeam.name}</b> (${g.sTeam.id})<br><span class="text-slate-500 text-[10px]">${g.sTeam.phone}</span>
                                ${g.sTeam.plusName ? `<div class="mt-2 pt-2 border-t border-slate-200"><b>${g.sTeam.plusName}</b><br><span class="text-slate-500 text-[10px]">${g.sTeam.plusPhone}</span></div>` : ''}</div>` : '<p class="text-slate-400 italic">기입 필요</p>'}
                                ${g.staff ? g.staff.map(s => `<div class="bg-slate-800 text-white p-2 rounded-xl mt-1 flex justify-between"><span><b>${s.name}</b><br>${s.phone}</span><button onclick="removeStaff(${i}, '${s.id}')">✕</button></div>`).join('') : ''}
                            </div>
                        </div>
                        <div class="space-y-2">
                            <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter mb-2">Juniors</p>
                            <div class="bg-slate-50 p-3 rounded-2xl border border-white space-y-3">
                                ${g.combinedJuniors.map(j => `<div><b>${j.name}</b> (${j.type})<br><span class="text-slate-500 text-[10px]">${j.phone}</span>
                                ${j.plusName ? `<div class="text-[10px] text-slate-400 opacity-70">• ${j.plusName} / ${j.plusPhone}</div>` : ''}
                                ${j.plusName2 ? `<div class="text-[10px] text-slate-400 opacity-70">• ${j.plusName2} / ${j.plusPhone2}</div>` : ''}</div>`).join('<div class="border-t border-slate-200"></div>')}
                            </div>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        }

        function addStaffToGroup(idx) {
            const name = prompt("이름:"); const phone = prompt("연락처:");
            if (!name || !phone) return;
            if (!currentGroups[idx].staff) currentGroups[idx].staff = [];
            currentGroups[idx].staff.push({ id: Date.now().toString(), name, phone });
            render(currentGroups);
        }

        function removeStaff(groupIdx, staffId) {
            currentGroups[groupIdx].staff = currentGroups[groupIdx].staff.filter(s => s.id !== staffId);
            render(currentGroups);
        }

        async function saveToFirebase() {
            if (currentGroups.length === 0) return alert("저장할 결과가 없습니다.");
            try {
                await db.collection("matching").doc("current_result").set({
                    data: JSON.stringify(currentGroups),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("서버 저장 완료! 링크를 통해 다른 사람들도 이 결과를 볼 수 있습니다.");
            } catch (e) { alert("저장 오류: Firebase 규칙 설정을 확인하세요."); }
        }
    </script>
</body>
</html>
