<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAU 학번 매칭 v5.7 Perfect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.025em; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
            <h1 class="text-2xl font-black text-slate-900 italic">Matching Engine <span class="text-blue-600 text-sm font-bold">v5.7</span></h1>
            <div id="statArea" class="mt-4 flex justify-center gap-10 font-bold text-sm text-slate-500">
                <div>선배 신청: <span id="seniorStat" class="text-blue-600 text-lg">0팀</span></div>
                <div>후배 신청: <span id="juniorStat" class="text-emerald-600 text-lg">0팀</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 max-w-2xl mx-auto">
                <div class="bg-blue-600 p-4 rounded-2xl text-center shadow-lg text-white">
                    <p class="text-[11px] opacity-80 font-bold mb-1">매칭 성공 (선배 배정)</p>
                    <p id="matchSuccessCount" class="text-2xl font-black">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl text-center shadow-lg text-white">
                    <p class="text-[11px] opacity-80 font-bold mb-1">학생회 투입 필요</p>
                    <p id="matchFailCount" class="text-2xl font-black">0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <textarea id="seniorData" rows="6" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-white outline-none focus:ring-2 focus:ring-blue-400" placeholder="Senior JSON"></textarea>
                <textarea id="juniorData" rows="6" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-white outline-none focus:ring-2 focus:ring-emerald-400" placeholder="Junior JSON"></textarea>
                <button onclick="runFinalV57Match()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 text-lg">완전 매칭 실행 ⚡</button>
                <button onclick="saveToFirebase()" class="w-full bg-white hover:bg-slate-50 text-slate-600 font-bold py-3 rounded-2xl border border-slate-200 transition-all">결과 서버에 저장 ☁️</button>
            </div>
            <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-[800px] flex flex-col">
                <div id="resultContainer" class="flex-1 overflow-y-auto space-y-4 pr-3 custom-scrollbar text-[11px]">
                    <p class="text-center text-slate-300 mt-20 italic">매칭 실행 버튼을 눌러주세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase 설정 (윤정 님의 설정값으로 꼭 확인!)
        const firebaseConfig = { apiKey: "AIzaSyBqxhmeJBTrrYCil_0TZZ7N4lvBwLCHQgY",
  authDomain: "index-57ec0.firebaseapp.com",
  projectId: "index-57ec0",
  storageBucket: "index-57ec0.firebasestorage.app",
  messagingSenderId: "451060671210",
  appId: "1:451060671210:web:5dd9e2a430b3ac2a682d93" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentGroups = [];
        const dateOrder = ["3/16(월)", "3/17(화)", "3/18(수)", "3/19(목)", "3/20(금)", "3/21(토)", "3/22(일)", "3/23(월)", "3/24(화)", "3/25(수)", "3/26(목)", "3/27(금)", "무작위(날짜조율필요)"];

        window.onload = async () => {
            try {
                const doc = await db.collection("matching").doc("current_result").get();
                if (doc.exists) {
                    currentGroups = JSON.parse(doc.data().data);
                    render(currentGroups);
                    updateStats(); // 로드 후 통계 즉시 갱신
                }
            } catch (e) { console.log("로드 실패"); }
        };

        function updateStats() {
            // 1. 입력창 데이터 기준
            const sIn = document.getElementById('seniorData').value;
            const jIn = document.getElementById('juniorData').value;
            
            try {
                if(sIn && jIn) {
                    document.getElementById('seniorStat').innerText = JSON.parse(sIn).length + "팀";
                    document.getElementById('juniorStat').innerText = JSON.parse(jIn).length + "팀";
                } else if(currentGroups.length > 0) {
                    // 2. 입력창 비었을 땐 매칭된 결과 데이터 기준
                    let sCount = currentGroups.filter(g => g.sTeam).length;
                    let jCount = 0;
                    currentGroups.forEach(g => { if(g.combinedJuniors) jCount += g.combinedJuniors.length; });
                    document.getElementById('seniorStat').innerText = sCount + "팀";
                    document.getElementById('juniorStat').innerText = jCount + "팀";
                }
            } catch(e) {}
            
            document.getElementById('matchSuccessCount').innerText = currentGroups.filter(g => g.type === 'SUCCESS').length;
            document.getElementById('matchFailCount').innerText = currentGroups.filter(g => g.type === 'FAIL').length;
        }

        function runFinalV57Match() {
            try {
                const rawSeniors = JSON.parse(document.getElementById('seniorData').value || "[]");
                const rawJuniors = JSON.parse(document.getElementById('juniorData').value || "[]");
                
                let sPool = rawSeniors.filter(s => !s.dates.includes("모두 불가") && s.dates.length > 0);
                let unavailableSeniors = rawSeniors.filter(s => s.dates.includes("모두 불가") || s.dates.length === 0);
                let jPool = [...rawJuniors];
                let groups = [];

                sPool.sort((a, b) => a.dates.length - b.dates.length);

                // 매칭 메인 로직
                dateOrder.slice(0, 12).forEach(date => {
                    ['여', '남'].forEach(gender => {
                        let curS = sPool.filter(s => s.dates.includes(date) && s.gender.trim() === gender);
                        let curJ = jPool.filter(j => j.dates.includes(date) && j.gender.trim() === gender);
                        while (curS.length > 0 && curJ.length > 0) {
                            let sTeam = curS.shift();
                            let combinedJuniors = fillGroupBalanced(curJ, jPool);
                            if (combinedJuniors.length > 0) {
                                groups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors, mode: '균형 매칭' });
                                sPool = sPool.filter(s => s !== sTeam);
                            } else break;
                        }
                    });
                });

                // 성별 통합 매칭
                dateOrder.slice(0, 12).forEach(date => {
                    let curS = sPool.filter(s => s.dates.includes(date));
                    let curJ = jPool.filter(j => j.dates.includes(date));
                    while (curS.length > 0 && curJ.length > 0) {
                        let sTeam = curS.shift();
                        let combinedJuniors = fillGroupBalanced(curJ, jPool);
                        groups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors, mode: '성별 통합' });
                        sPool = sPool.filter(s => s !== sTeam);
                        curJ = jPool.filter(j => j.dates.includes(date));
                    }
                });

                // 무작위 선배 구제
                let remainingSeniors = [...sPool, ...unavailableSeniors];
                remainingSeniors.forEach(sTeam => {
                    if (jPool.length > 0) {
                        let combinedJuniors = fillGroupBalanced(jPool, jPool);
                        groups.push({ type: 'SUCCESS', date: '무작위(날짜조율필요)', sTeam, combinedJuniors, mode: '무작위 구제' });
                    }
                });

                // 남은 후배 학생회 투입
                dateOrder.slice(0, 12).forEach(date => {
                    let curJ = jPool.filter(j => j.dates.includes(date));
                    while (curJ.length > 0) {
                        let combinedJuniors = fillGroupBalanced(curJ, jPool);
                        groups.push({ type: 'FAIL', date, combinedJuniors, mode: '학생회 투입' });
                        curJ = jPool.filter(j => j.dates.includes(date));
                    }
                });

                // ★ 날짜순 정렬 (절대 고정)
                groups.sort((a, b) => dateOrder.indexOf(a.date) - dateOrder.indexOf(b.date));

                currentGroups = groups;
                render(groups);
                updateStats();
            } catch (e) { alert("JSON 형식을 확인해주세요!"); }
        }

        function fillGroupBalanced(list, master) {
            if (list.length === 0) return [];
            let combined = [];
            let solos = list.filter(j => j.type === '개별팀');

            // ★ 4명일 때 2:2 분할 강제 적용 (박연우, 이진모 등 케이스 해결)
            if (solos.length === 4) {
                for (let i = 0; i < 2; i++) {
                    let s = solos.shift();
                    combined.push(s);
                    master.splice(master.indexOf(s), 1);
                    list.splice(list.indexOf(s), 1);
                }
                return combined;
            }

            let teams = list.filter(j => j.type !== '개별팀');
            if (teams.length > 0) {
                let t = teams[0];
                combined.push(t);
                master.splice(master.indexOf(t), 1);
                list.splice(list.indexOf(t), 1);
                let currentSize = t.type.includes('3인') ? 3 : 2;
                while (currentSize < 3 && list.filter(j => j.type === '개별팀').length > 0) {
                    let s = list.filter(j => j.type === '개별팀')[0];
                    combined.push(s);
                    master.splice(master.indexOf(s), 1);
                    list.splice(list.indexOf(s), 1);
                    currentSize++;
                }
            } else if (solos.length > 0) {
                let limit = (solos.length >= 3) ? 3 : solos.length;
                for (let i = 0; i < limit; i++) {
                    let s = solos.shift();
                    combined.push(s);
                    master.splice(master.indexOf(s), 1);
                    list.splice(list.indexOf(s), 1);
                }
            }
            return combined;
        }

        function render(groups) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            groups.forEach((g, i) => {
                const isSuccess = g.type === 'SUCCESS';
                const div = document.createElement('div');
                div.className = `p-5 border-2 rounded-[2.5rem] mb-4 bg-white shadow-sm ${isSuccess ? 'border-blue-100' : 'border-orange-100 bg-orange-50/20'}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-100">
                        <span class="font-black text-slate-800 text-sm">조 #${i+1} <span class="text-[10px] text-slate-400 font-normal ml-2">${g.date}</span></span>
                        <span class="text-[9px] font-bold px-2 py-1 rounded-full ${isSuccess?'bg-blue-600 text-white':'bg-orange-600 text-white'} uppercase">${g.mode}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="flex justify-between items-center mb-1"><p class="text-[9px] font-black text-slate-400 uppercase italic">Senior / Staff</p>
                            <button onclick="addStaffToGroup(${i})" class="text-[9px] font-bold text-blue-600 underline">+ 기입</button></div>
                            <div class="bg-slate-50 p-4 rounded-3xl border border-white space-y-2 shadow-inner min-h-[80px]">
                                ${g.sTeam ? `<b class="text-slate-900 text-sm">${g.sTeam.name}</b> (${g.sTeam.id})<br><span class="text-slate-500 text-[10px]">${g.sTeam.phone}</span>${g.sTeam.plusName ? `<div class="mt-1 pt-1 border-t border-slate-200"><b>${g.sTeam.plusName}</b><br><span class="text-slate-500 text-[9px]">${g.sTeam.plusPhone}</span></div>` : ''}` : '<p class="text-slate-400 italic font-bold">학생회 기입 필요</p>'}
                                ${g.staff ? g.staff.map(s => `<div class="bg-slate-800 text-white p-2 rounded-xl flex justify-between items-center mt-1"><span><b class="text-xs">${s.name}</b><br><span class="text-[9px]">${s.phone}</span></span><button onclick="removeStaff(${i}, '${s.id}')">✕</button></div>`).join('') : ''}
                            </div>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase italic mb-1">Juniors</p>
                            <div class="bg-slate-50 p-4 rounded-3xl border border-white shadow-inner min-h-[80px]">
                                ${g.combinedJuniors.map(j => `<div class="pb-2 last:pb-0"><b class="text-slate-900 text-sm">${j.name}</b> (${j.type})<br><span class="text-slate-500 text-[10px]">${j.phone}</span>${j.plusName ? `<div class="text-[10px] text-slate-400 mt-1"><b>• ${j.plusName} (${j.plusPhone})</b></div>` : ''}${j.plusName2 ? `<div class="text-[10px] text-slate-400"><b>• ${j.plusName2} (${j.plusPhone2})</b></div>` : ''}</div>`).join('<div class="border-t border-slate-100 my-2"></div>')}
                            </div>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        }

        async function saveToFirebase() {
            try {
                await db.collection("matching").doc("current_result").set({ data: JSON.stringify(currentGroups), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                alert("서버 저장 완료!");
            } catch (e) { alert("저장 실패"); }
        }

        function addStaffToGroup(idx) {
            const name = prompt("이름:"); const phone = prompt("연락처:");
            if (!name || !phone) return;
            if (!currentGroups[idx].staff) currentGroups[idx].staff = [];
            currentGroups[idx].staff.push({ id: Date.now().toString(), name, phone });
            render(currentGroups);
        }

        function removeStaff(groupIdx, staffId) {
            currentGroups[groupIdx].staff = currentGroups[groupIdx].staff.filter(s => s.id !== staffId);
            render(currentGroups);
        }
    </script>
</body>
</html>
