<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAU 학번 매칭 v5.1 Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.025em; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
            <h1 class="text-2xl font-black text-slate-900 italic">Matching Engine <span class="text-blue-600 text-sm font-bold">v5.1 (전원 배정 모드)</span></h1>
            <div id="statArea" class="mt-4 flex justify-center gap-10 font-bold text-sm">
                <div>선배 신청: <span id="seniorStat" class="text-blue-600">0팀</span></div>
                <div>후배 신청: <span id="juniorStat" class="text-emerald-600">0팀</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 max-w-2xl mx-auto">
                <div class="bg-blue-600 p-4 rounded-2xl text-center shadow-lg text-white">
                    <p class="text-[11px] opacity-80 font-bold mb-1">매칭 성공 (선배 배정)</p>
                    <p id="matchSuccessCount" class="text-2xl font-black">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl text-center shadow-lg text-white">
                    <p class="text-[11px] opacity-80 font-bold mb-1">학생회 투입 필요</p>
                    <p id="matchFailCount" class="text-2xl font-black">0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <textarea id="seniorData" rows="6" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-white outline-none focus:ring-2 focus:ring-blue-400" placeholder="Senior JSON"></textarea>
                <textarea id="juniorData" rows="6" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-white outline-none focus:ring-2 focus:ring-emerald-400" placeholder="Junior JSON"></textarea>
                <button onclick="runFinalV51Match()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-2xl shadow-xl transition-all active:scale-95 text-lg">완전 매칭 실행 ⚡</button>
                <button onclick="saveToFirebase()" class="w-full bg-white hover:bg-slate-50 text-slate-600 font-bold py-3 rounded-2xl border border-slate-200 transition-all">현재 결과 서버에 저장 ☁️</button>
            </div>
            <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-[800px] flex flex-col">
                <div id="resultContainer" class="flex-1 overflow-y-auto space-y-4 pr-3 custom-scrollbar text-[11px]">
                    <p class="text-center text-slate-300 mt-20 italic">매칭 버튼을 눌러주세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBqxhmeJBTrrYCil_0TZZ7N4lvBwLCHQgY",
  authDomain: "index-57ec0.firebaseapp.com",
  projectId: "index-57ec0",
  storageBucket: "index-57ec0.firebasestorage.app",
  messagingSenderId: "451060671210",
  appId: "1:451060671210:web:5dd9e2a430b3ac2a682d93" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentGroups = [];

        window.onload = async () => {
            try {
                const doc = await db.collection("matching").doc("current_result").get();
                if (doc.exists) {
                    currentGroups = JSON.parse(doc.data().data);
                    render(currentGroups);
                    updateStats(currentGroups);
                }
            } catch (e) { console.log("로드 실패"); }
        };

        function runFinalV51Match() {
            try {
                const rawSeniors = JSON.parse(document.getElementById('seniorData').value || "[]");
                const rawJuniors = JSON.parse(document.getElementById('juniorData').value || "[]");
                
                let sPool = rawSeniors.filter(s => !s.dates.includes("모두 불가") && s.dates.length > 0);
                let unavailableSeniors = rawSeniors.filter(s => s.dates.includes("모두 불가") || s.dates.length === 0);
                let jPool = [...rawJuniors];
                let groups = [];
                const dates = ["3/16(월)", "3/17(화)", "3/18(수)", "3/19(목)", "3/20(금)", "3/21(토)", "3/22(일)", "3/23(월)", "3/24(화)", "3/25(수)", "3/26(목)", "3/27(금)"];

                sPool.sort((a, b) => a.dates.length - b.dates.length);

                // 1~2단계: 날짜별 매칭 및 인원 최적화
                dates.forEach(date => {
                    ['여', '남'].forEach(gender => {
                        let curS = sPool.filter(s => s.dates.includes(date) && s.gender.trim() === gender);
                        let curJ = jPool.filter(j => j.dates.includes(date) && j.gender.trim() === gender);

                        while (curS.length > 0 && curJ.length > 0) {
                            let sTeam = curS.shift();
                            let combinedJuniors = fillGroupSmart(curJ, jPool);
                            if (combinedJuniors.length > 0) {
                                groups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors, mode: '정상 매칭' });
                                sPool = sPool.filter(s => s !== sTeam);
                            } else break;
                        }
                    });
                });

                // 3단계: 성별 통합 매칭
                dates.forEach(date => {
                    let curS = sPool.filter(s => s.dates.includes(date));
                    let curJ = jPool.filter(j => j.dates.includes(date));
                    while (curS.length > 0 && curJ.length > 0) {
                        let sTeam = curS.shift();
                        let combinedJuniors = fillGroupSmart(curJ, jPool);
                        groups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors, mode: '성별 통합' });
                        sPool = sPool.filter(s => s !== sTeam);
                        curJ = jPool.filter(j => j.dates.includes(date));
                    }
                });

                // 4단계: 날짜 맞는 게 없는 선배 + 불가 선배들 무작위 배정
                let remainingSeniors = [...sPool, ...unavailableSeniors];
                remainingSeniors.forEach(sTeam => {
                    if (jPool.length > 0) {
                        let combinedJuniors = fillGroupSmart(jPool, jPool);
                        groups.push({ type: 'SUCCESS', date: '무작위(날짜조율필요)', sTeam, combinedJuniors, mode: '무작위 구제' });
                    }
                });

                // 5단계: 남은 후배들 학생회 조
                dates.forEach(date => {
                    let curJ = jPool.filter(j => j.dates.includes(date));
                    while (curJ.length > 0) {
                        let combinedJuniors = fillGroupSmart(curJ, jPool);
                        groups.push({ type: 'FAIL', date, combinedJuniors, mode: '학생회 투입' });
                        curJ = jPool.filter(j => j.dates.includes(date));
                    }
                });

                currentGroups = groups;
                render(groups);
                updateStats(groups);
            } catch (e) { alert("JSON 형식을 확인해주세요!"); }
        }

        function fillGroupSmart(list, master) {
            let combined = []; let total = 0;
            let soloRun = list.filter(j => j.type === '개별팀');
            if (total === 0 && soloRun.length === 4) {
                let s1 = soloRun.shift(); let s2 = soloRun.shift();
                combined.push(s1, s2);
                master.splice(master.indexOf(s1), 1); master.splice(master.indexOf(s2), 1);
                return combined;
            }
            let teams = list.filter(j => j.type !== '개별팀');
            if (teams.length > 0) {
                let t = teams[0];
                combined.push(t); total += (t.type.includes('3인') ? 3 : 2);
                master.splice(master.indexOf(t), 1); list.splice(list.indexOf(t), 1);
            }
            while (total < 3 && list.length > 0) {
                let s = list.filter(j => j.type === '개별팀')[0];
                if (!s) break;
                combined.push(s); total += 1;
                master.splice(master.indexOf(s), 1); list.splice(list.indexOf(s), 1);
            }
            return combined;
        }

        function render(groups) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            groups.forEach((g, i) => {
                const isSuccess = g.type === 'SUCCESS';
                const div = document.createElement('div');
                div.className = `p-5 border-2 rounded-[2rem] mb-4 bg-white shadow-sm ${isSuccess ? 'border-blue-100' : 'border-orange-100 bg-orange-50/20'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4 border-b pb-2 border-slate-100">
                        <span class="font-black text-slate-800">조 #${i+1} <span class="text-[10px] text-slate-400 font-normal ml-2">${g.date}</span></span>
                        <span class="text-[9px] font-bold px-2 py-1 rounded-full ${isSuccess?'bg-blue-600 text-white':'bg-orange-500 text-white'} uppercase">${g.mode}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-[10px]">
                        <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Senior</p>
                        <div class="bg-slate-50 p-3 rounded-2xl border border-white">
                            ${g.sTeam ? `<b>${g.sTeam.name}</b><br>${g.sTeam.phone}${g.sTeam.plusName ? `<br>+${g.sTeam.plusName}` : ''}` : '학생회 기입'}
                        </div></div>
                        <div><p class="text-[9px] font-black text-slate-400 uppercase mb-1">Juniors</p>
                        <div class="bg-slate-50 p-3 rounded-2xl border border-white space-y-2">
                            ${g.combinedJuniors.map(j => `<b>${j.name}</b> (${j.type})`).join('<br>')}
                        </div></div>
                    </div>`;
                container.appendChild(div);
            });
        }

        function updateStats(groups) {
            const sIn = document.getElementById('seniorData').value;
            const jIn = document.getElementById('juniorData').value;
            try {
                document.getElementById('seniorStat').innerText = JSON.parse(sIn || "[]").length + "팀";
                document.getElementById('juniorStat').innerText = JSON.parse(jIn || "[]").length + "팀";
            } catch(e) {}
            document.getElementById('matchSuccessCount').innerText = groups.filter(g => g.type === 'SUCCESS').length;
            document.getElementById('matchFailCount').innerText = groups.filter(g => g.type === 'FAIL').length;
        }

        async function saveToFirebase() {
            try {
                await db.collection("matching").doc("current_result").set({ data: JSON.stringify(currentGroups), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                alert("서버 저장 완료!");
            } catch (e) { alert("저장 실패"); }
        }
    </script>
</body>
</html>
