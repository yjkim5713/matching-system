<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAU Pharmacy Matching v9.7</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; letter-spacing: -0.025em; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <header class="mb-8 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center">
            <h1 class="text-2xl font-black text-slate-900 italic tracking-tighter italic">Matching Engine <span class="text-blue-600 text-sm font-bold">v9.7 (타겟팅 매칭)</span></h1>
            <div id="statArea" class="mt-4 flex justify-center gap-10 font-black text-sm text-slate-500">
                <div>선배 신청: <span id="seniorStat" class="text-blue-600 text-xl">0팀</span></div>
                <div>후배 신청: <span id="juniorStat" class="text-emerald-600 text-xl">0팀</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6 max-w-2xl mx-auto text-white">
                <div class="bg-blue-600 p-4 rounded-2xl text-center shadow-lg">
                    <p class="text-[11px] opacity-80 font-bold mb-1 uppercase tracking-widest">Matched Senior Groups</p>
                    <p id="matchSuccessCount" class="text-2xl font-black">0</p>
                </div>
                <div class="bg-slate-800 p-4 rounded-2xl text-center shadow-lg">
                    <p class="text-[11px] opacity-80 font-bold mb-1 uppercase tracking-widest">Staff Needed (Juniors)</p>
                    <p id="matchFailCount" class="text-2xl font-black">0</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 space-y-4">
                <textarea id="seniorData" rows="6" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-white outline-none focus:ring-2 focus:ring-blue-400" placeholder="Senior JSON"></textarea>
                <textarea id="juniorData" rows="6" class="w-full p-4 border rounded-2xl text-[10px] font-mono bg-white outline-none focus:ring-2 focus:ring-emerald-400" placeholder="Junior JSON"></textarea>
                <button onclick="runUltimateV97()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-2xl shadow-xl transition-all active:scale-95 text-lg">전원 매칭 및 타겟팅 실행 ⚡</button>
                <button onclick="saveToFirebase()" class="w-full bg-white hover:bg-slate-50 text-slate-600 font-bold py-3 rounded-2xl border border-slate-200 transition-all">결과 서버 저장 ☁️</button>
            </div>
            <div class="lg:col-span-3 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 h-[800px] flex flex-col">
                <div id="resultContainer" class="flex-1 overflow-y-auto space-y-4 pr-3 custom-scrollbar text-[11px]">
                    <p class="text-center text-slate-300 mt-20 font-bold italic">매칭 버튼을 눌러주세요.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBqxhmeJBTrrYCil_0TZZ7N4lvBwLCHQgY",
  authDomain: "index-57ec0.firebaseapp.com",
  projectId: "index-57ec0",
  storageBucket: "index-57ec0.firebasestorage.app",
  messagingSenderId: "451060671210",
  appId: "1:451060671210:web:5dd9e2a430b3ac2a682d93" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const dateOrder = ["3/16(월)", "3/17(화)", "3/18(수)", "3/19(목)", "3/20(금)", "3/21(토)", "3/22(일)", "3/23(월)", "3/24(화)", "3/25(수)", "3/26(목)", "3/27(금)"];

        function runUltimateV97() {
            try {
                const sIn = JSON.parse(document.getElementById('seniorData').value || "[]");
                const jIn = JSON.parse(document.getElementById('juniorData').value || "[]");
                
                let sPool = [...sIn];
                let jPool = [...jIn];
                let finalGroups = [];

                // 1. 선배 정렬: 날짜 적은 순 (이래현, 박연수 보호)
                sPool.sort((a, b) => {
                    if (a.dates.includes("모두 불가")) return 1;
                    if (b.dates.includes("모두 불가")) return -1;
                    return a.dates.length - b.dates.length;
                });

                // 2. [특수 타겟팅] 김민재 선배님 먼저 매칭 (개별 1인 또는 2인팀)
                let minjaeIndex = sPool.findIndex(s => s.name.includes("김민재"));
                if (minjaeIndex !== -1) {
                    let minjae = sPool[minjaeIndex];
                    let targets = jPool.filter(j => (j.type === "개별팀" || j.type === "2인팀") && minjae.dates.some(d => j.dates.includes(d)));
                    if (targets.length > 0) {
                        let combined = [targets[0]];
                        jPool.splice(jPool.indexOf(targets[0]), 1);
                        finalGroups.push({
                            date: minjae.dates.find(d => combined[0].dates.includes(d)) || minjae.dates[0],
                            sTeam: minjae,
                            combinedJuniors: combined,
                            mode: "타겟팅 매칭"
                        });
                        sPool.splice(minjaeIndex, 1);
                    }
                }

                // 3. 날짜별 일반 매칭
                dateOrder.forEach(date => {
                    let curS = sPool.filter(s => s.dates.includes(date));
                    let curJ = jPool.filter(j => j.dates.includes(date));

                    while (curS.length > 0 && curJ.length > 0) {
                        let combined = getJuniorsV97(curJ, jPool);
                        if (combined.length > 0) {
                            let sTeam = curS.shift();
                            finalGroups.push({ type: 'SUCCESS', date, sTeam, combinedJuniors: combined, mode: "매칭 성공" });
                            sPool = sPool.filter(s => s !== sTeam);
                            curS = sPool.filter(s => s.dates.includes(date));
                            curJ = jPool.filter(j => j.dates.includes(date));
                        } else break;
                    }
                });

                // 4. 남은 선배(김민석 팀 등) 강제 구제
                sPool.forEach(senior => {
                    let combined = jPool.length > 0 ? getJuniorsV97(jPool, jPool) : [];
                    finalGroups.push({
                        date: senior.dates[0] === "모두 불가" ? "날짜조율필요" : senior.dates[0],
                        sTeam: senior,
                        combinedJuniors: combined,
                        mode: "전원 배정"
                    });
                });

                // 5. 남은 후배들 학생회 조
                while (jPool.length > 0) {
                    let combined = getJuniorsV97(jPool, jPool);
                    finalGroups.push({ date: combined[0]?.dates[0] || "날짜미정", sTeam: null, combinedJuniors: combined, mode: "학생회 투입" });
                }

                // ★ 결과 리스트 날짜순 정렬 (3/16부터)
                finalGroups.sort((a, b) => {
                    const idxA = dateOrder.indexOf(a.date);
                    const idxB = dateOrder.indexOf(b.date);
                    if (idxA === -1 && idxB === -1) return 0;
                    if (idxA === -1) return 1;
                    if (idxB === -1) return -1;
                    return idxA - idxB;
                });

                currentGroups = finalGroups;
                render(finalGroups);
                document.getElementById('seniorStat').innerText = sIn.length + "팀";
                document.getElementById('juniorStat').innerText = jIn.length + "팀";
                document.getElementById('matchSuccessCount').innerText = sIn.length;
                document.getElementById('matchFailCount').innerText = finalGroups.filter(g => !g.sTeam).length;

            } catch (e) { alert("JSON 데이터를 확인해주세요!"); }
        }

        function getJuniorsV97(list, master) {
            if (list.length === 0) return [];
            let combined = [];
            let solos = list.filter(j => j.type === '개별팀');
            let teams = list.filter(j => j.type !== '개별팀');

            if (solos.length === 4) {
                for (let i = 0; i < 2; i++) {
                    let s = solos.shift(); combined.push(s);
                    master.splice(master.indexOf(s), 1); list.splice(list.indexOf(s), 1);
                }
                return combined;
            }
            if (teams.length > 0) {
                let t = teams[0]; combined.push(t);
                master.splice(master.indexOf(t), 1); list.splice(list.indexOf(t), 1);
                if (t.type.includes('2인') && list.filter(j => j.type === '개별팀').length > 0) {
                    let s = list.filter(j => j.type === '개별팀')[0];
                    combined.push(s); master.splice(master.indexOf(s), 1); list.splice(list.indexOf(s), 1);
                }
            } else {
                let count = (solos.length >= 2) ? (solos.length === 4 ? 2 : (solos.length >= 3 ? 3 : 2)) : 1;
                for (let i = 0; i < count; i++) {
                    if (solos.length > 0) {
                        let s = solos.shift(); combined.push(s);
                        master.splice(master.indexOf(s), 1); list.splice(list.indexOf(s), 1);
                    }
                }
            }
            return combined;
        }

        function render(groups) {
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            groups.forEach((g, i) => {
                const isSuccess = !!g.sTeam;
                const div = document.createElement('div');
                div.className = `p-6 border-2 rounded-[2.5rem] mb-4 bg-white shadow-sm ${isSuccess ? 'border-blue-100' : 'border-orange-100 bg-orange-50/20'}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4 border-b pb-3 border-slate-100">
                        <span class="font-black text-slate-800 text-sm">조 #${i+1} <span class="text-[10px] text-slate-400 font-normal ml-2">${g.date}</span></span>
                        <span class="text-[9px] font-bold px-2 py-1 rounded-full ${isSuccess?'bg-blue-600 text-white':'bg-orange-600 text-white'} uppercase">${g.mode}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase italic mb-1">Senior Team</p>
                            <div class="bg-slate-50 p-4 rounded-3xl border border-white space-y-2 min-h-[110px] shadow-inner text-[10px]">
                                ${g.sTeam ? `<b class="text-slate-900 text-[14px] font-black leading-tight">${g.sTeam.name}</b> (${g.sTeam.id})<br><span>${g.sTeam.phone}</span>${g.sTeam.plusName ? `<div class="mt-2 pt-2 border-t border-slate-200"><b>${g.sTeam.plusName}</b><br><span>${g.sTeam.plusPhone}</span></div>` : ''}` : '<p class="text-slate-400 italic font-bold">학생회 조</p>'}
                            </div>
                        </div>
                        <div>
                            <p class="text-[9px] font-black text-slate-400 uppercase italic mb-1">Juniors (2-3명)</p>
                            <div class="bg-slate-50 p-4 rounded-3xl border border-white space-y-3 min-h-[110px] shadow-inner text-[10px]">
                                ${g.combinedJuniors.map(j => `
                                    <div class="pb-2 last:pb-0">
                                        <b class="text-slate-900 text-[15px] font-black underline decoration-blue-100 leading-tight">${j.name}</b> (${j.type})<br>
                                        <span>${j.phone}</span>
                                        ${j.plusName ? `<div class="mt-1 font-bold">• ${j.plusName} (${j.plusPhone})</div>` : ''}
                                        ${j.plusName2 ? `<div class="mt-0.5 font-bold">• ${j.plusName2} (${j.plusPhone2})</div>` : ''}
                                    </div>`).join('<div class="border-t border-slate-100 my-2"></div>')}
                            </div>
                        </div>
                    </div>`;
                container.appendChild(div);
            });
        }
        
        async function saveToFirebase() {
            try {
                await db.collection("matching").doc("current_result").set({ data: JSON.stringify(currentGroups), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
                alert("서버 저장 완료!");
            } catch (e) { alert("저장 실패"); }
        }
    </script>
</body>
</html>
